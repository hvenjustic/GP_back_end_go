  model: gpt-5.1
  timeout: 120

prompts:
  preprocess_path: ../prompt.md
  entity_path: ../prompt.md
  preprocess_inline: "## 网页预处理提示词\n        \"\"\"\n        你是一个用于预处理爬取的网页内容的过滤器，\n\n        服务于生物技术商业知识图谱的构建。\n\n        你的任务：\n\n        给定一段文本（通常为嘈杂的网页内容），\n\n        判断其中是否包含对构建生物技术/生命科学商业知识图谱有用的信息。\n        --------------------\n        # 什么算作**有用信息**\n\n        如果文本中包含或明确暗示以下任一情况，则视为有用：\n\n        1. **组织机构**  \n        - 公司、生物技术初创企业、制药公司  \n        - 研究实验室、大学、研究机构  \n\n        2. **人物**  \n        - 科学家、首席研究员（PI）、商业领袖  \n        - 其职位、所属机构、角色或成就  \n\n        3. **产品/服务**  \n        - 设备、试剂、细胞系、CRO服务、软件  \n        - 产品特性、用途、性能、应用场景  \n\n        4. **研究产出/主题**  \n        - 研究论文、专利、临床试验、研究主题  \n        - 关键发现、方法、应用或聚焦的主题  \n\n        5. **事件/动态**  \n        - 融资轮次、并购事件、新产品发布、研究突破  \n        - 公告、合作、伙伴关系、授权许可交易  \n\n        6. **显式关系**  \n        - 公司与另一组织合作/结成伙伴关系  \n        - 科学家在某实验室/公司任职  \n        - 组织发表论文、推出产品  \n        - 任何描述“谁在何时与谁做了什么、关于什么”的内容  \n\n        7. **与生物，医疗等领域有关的内容**\n\n        什么视为**噪声**，例如：  \n        - 纯界面/导航文字、Cookie政策、法律声明、链接 \n        - 无具体实体的通用营销口号  \n        - 空泛的问候语、“联系我们”、“订阅新闻通讯”等  \n        - 目标与计划等与生物或医疗领域无直接关系的内容\n        --------------------\n        # 输出格式\n\n        你必须输出一个单一的 JSON 对象，包含以下字段：\n\n        ```json\n        {\n        \"has_relevant_info\": true 或 false,\n        \"body\": \"经处理后的输入文本主体内容\",\n        \"reason\": \"用中文简要说明保留或丢弃该段落的原因\"\n        }\n        ```\n\n        规则：  \n        - 判断输入是否包含有用内容。若有，仅去除噪声，保留主干内容并维持原始结构。  \n        - “body”字段中只包含有用的主要内容。  \n        - 若无有用内容，则设置：  \n        - `\"has_relevant_info\": false`  \n        - `\"body\": {}`  \n        - 仅移除噪声，不得添加额外字段。  \n        - 不得在 JSON 外添加任何注释。\n\n        --------------------\n        # 输入文本\n\n        {{text_block}}\n        \"\"\""
  entity_inline: "## 实体识别提取提示词\n\n        \"\"\"\n        你是一个用于生物技术商业知识图谱的信息抽取模型。\n\n        给定一段文本（通常为Markdown 格式），请根据以下模式抽取结构化的**实体**（ENTITIES）和**关系**（RELATIONS）。\n\n        你必须仅输出一个有效的 JSON 对象。  \n        不得包含任何解释或额外文本。\n\n        --------------------\n        # 实体类型（必须使用以下值之一）\n\n        ## 组织机构（Organization）\n        - Company（公司）  \n        - Research Lab（研究实验室）  \n        - University（大学）  \n\n        ## 人物（Person）\n        - Scientist（科学家）  \n        - Principal Investigator (PI)（首席研究员）  \n        - Business Leader（商业领袖）  \n\n        ## 产品/服务（Product / Service）\n        - Equipment（设备）  \n        - Reagent（试剂）  \n        - Cell Line（细胞系）  \n        - CRO Service（合同研究组织服务）  \n        - Software（软件）  \n\n        ## 研究产出/主题（Research Artifact / Topic）\n        - Research Paper（研究论文）  \n        - Patent（专利）  \n        - Clinical Trial（临床试验）  \n        - Research Topic（研究主题）  \n\n        ## 工艺实体（Process Entity）\n        - Fermentation Process（发酵工艺）  \n        - Purification Method（纯化方法）  \n        - Quality Control Parameter（质量控制参数）  \n\n        ## 事件（Event）\n        - Funding Round（融资轮次）  \n        - M&A Event（并购事件）  \n        - New Product Launch（新产品发布）  \n        - Research Breakthrough（研究突破）  \n\n        ## 研究要素（Research Element）\n        - Research Paper（研究论文）  \n        - Patent（专利）  \n        - Clinical Trial（临床试验）  \n        - Research Topic（研究主题）  \n\n        --------------------\n        # 关系类型\n\n        仅在文本明确支持的情况下使用以下关系类型：\n\n        - **SUPPLIES**  \n        Company -[SUPPLIES]-> Reagent（或 Equipment）  \n\n        - **PARTNERS_WITH**  \n        Company -[PARTNERS_WITH]-> Research Lab（或 University / Company）  \n\n        - **WORKS_AT**  \n        Scientist/PI/Business Leader -[WORKS_AT]-> Company/Research Lab/University  \n\n        - **PUBLISHES**  \n        Research Lab/University -[PUBLISHES]-> Research Paper  \n\n        - **MENTIONS**  \n        Research Paper -[MENTIONS]-> 基因或其他生物/技术实体  \n\n        - **ANNOUNCED_LAUNCH_EVENT**  \n        Company -[ANNOUNCED_LAUNCH_EVENT]-> New Product Launch  \n\n        - **DESCRIBES**  \n        Company -[DESCRIBES]-> Process（例如 Fermentation Process）  \n        Patent -[DESCRIBES]-> Process（例如 Purification Method）  \n\n        - **IMPACTS**  \n        Process -[IMPACTS]-> Product Quality  \n        Fermentation Process -[IMPACTS]-> Product Yield  \n\n        - **INCLUDES**  \n        Company -[INCLUDES]-> Research Paper  \n        Company -[INCLUDES]-> Patent  \n\n        如果文本暗示了其他有意义的关系但不符合上述类型，可使用通用关系类型：  \n        - **RELATED_TO**\n\n        --------------------\n        # 输出 JSON 模式\n\n        你必须返回一个包含以下字段的 JSON 对象：\n\n        ```json\n        {\n        \"entities\": [\n            {\n            \"name\": \"字符串，实体的标准名称\",\n            \"type\": \"上述列出的某一实体类型\",\n            \"aliases\": [\"可选别名1\", \"可选别名2\"],\n            \"description\": \"基于文本的简短描述（1–2 句）\",\n            \"extra\": {\n                \"country\": \"可选，适用于 Company/University\",\n                \"stage\": \"可选，适用于 Funding Round 或 Clinical Trial 阶段\",\n                \"role\": \"可选，适用于 Scientist/PI/Business Leader\",\n                \"date\": \"可选，适用于事件（若已知则用 YYYY-MM-DD 格式）\"\n            }\n            }\n        ],\n        \"relations\": [\n            {\n            \"source\": \"源实体名称\",\n            \"target\": \"目标实体名称\",\n            \"type\": \"上述关系类型之一，或 'RELATED_TO'\"\n            }\n        ]\n        }\n        ```\n\n        --------------------\n        # 输入文本\n\n        请从以下 Markdown 中抽取知识：\n\n        {{markdown}}\n\n        # 输入旧 JSON\n\n        请将结果合并到以下旧 JSON 中：\n\n        {{oldjson}}\n\n\n        \"\"\""

