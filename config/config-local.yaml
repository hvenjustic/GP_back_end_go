prompts:
  preprocess_path: ../prompt.md
  entity_path: ../prompt.md
  preprocess_inline: "## 网页预处理提示词\n        \"\"\"\n        You are a filter for preprocessing crawled web pages\n        for a biotech business knowledge graph.\n\n        Your task:\n        Given a piece of text (usually noisy web content),\n        Judge whether the content contains useful information.\n        for building a biotech / life science business knowledge graph.\n\n        --------------------\n        # What counts as USEFUL information\n\n        If the text contains or clearly implies at least one of the following situations, then the text is useful:\n\n        1.       **Organizations**\n        - Company, biotech startup, pharma company\n        - Research Lab, University, Research Institute\n\n        2.       **People**\n        - Scientist, Principal Investigator (PI), Business Leader\n        - Their positions, affiliations, roles, or achievements\n\n        3.       **Products / Services**\n        - Equipment, Reagent, Cell Line, CRO Service, Software\n        - Product features, usage, performance, application scenario\n\n        4.       **Research Artifacts / Topics**\n        - Research Paper, Patent, Clinical Trial, Research Topic\n        - Key findings, methods, applications, or topics they focus on\n\n        5.       **Events / Dynamics**\n        - Funding Round, M&A Event, New Product Launch, Research Breakthrough\n        - Announcements, collaborations, partnerships, licensing deals\n\n        6.       **Explicit Relations**\n        - Company collaborates/partners with another org\n        - Scientist works at a specific lab/company\n        - Org publishes a paper, launches a product\n        - Anything that describes “who does what with whom, about what, and when”\n\n        Everything else is considered NOISE, for example:\n        - Pure UI/navigation text, cookie policy, legal disclaimers\n        - Generic marketing slogans with no concrete entities\n        - Empty greetings, “contact us”, “subscribe to newsletter” etc.\n\n        --------------------\n        # Your output format\n\n        You MUST output a single JSON object with the following fields:\n\n        {\n        \"has_relevant_info\": true or false,\n        \"body\":\"The processed main body of the intput context\",\n        \"reason\": \"short explanation in Chinese why you kept or dropped this block\"\n        }\n\n        Rules:\n        - Determine whether the input contains useful content.    If it does, only remove noise and preserve the main content while keeping the original structure.\n        - Include only the useful main content in 'body'.\n        - If there are no useful content, set:\n        - \"has_relevance_info\": false\n        - \"body\": {}\n        - Only remove noise\n        - Do not add any extra keys.\n        - Do not add any comments outside the JSON.--------------------\n        # INPUT TEXT\n\n        {{text_block}}\n        \"\"\"\n\n### INPUT TEXT\n\n{{text_block}}\n\n---\n\nThese additions ensure that specific roles, positions, process-related entities, clinical trials, and breakthrough events are explicitly accounted for. This helps to avoid any missed entities or relations, particularly for the biotech domain."
  entity_inline: "## 实体识别提取提示词\n\n        \"\"\"\n        You are an information extraction model for a biotech business knowledge graph.\n\n        Given a piece of text (usually news, reports, web articles or Markdown), extract structured ENTITIES and RELATIONS according to the following schema.\n\n        You MUST output a single valid JSON object only.\n        Do NOT include any explanations or extra text.\n\n        --------------------\n        # ENTITY TYPES (use exactly one of the following values)\n\n        ## Organization\n        - Company\n        - Research Lab\n        - University\n\n        ## Person\n        - Scientist\n        - Principal Investigator (PI)\n        - Business Leader\n\n        ## Product / Service\n        - Equipment\n        - Reagent\n        - Cell Line\n        - CRO Service\n        - Software\n\n        ## Research Artifact / Topic\n        - Research Paper\n        - Patent\n        - Clinical Trial\n        - Research Topic\n\n        ## Process Entity\n        - Fermentation Process\n        - Purification Method\n        - Quality Control Parameter\n\n        ## Event\n        - Funding Round\n        - M&A Event\n        - New Product Launch\n        - Research Breakthrough\n\n        ## Research Element\n        - Research Paper\n        - Patent\n        - Clinical Trial\n        - Research Topic\n\n        --------------------\n        # RELATION TYPES\n\n        Use ONLY these relation types when they are clearly supported by the text.\n\n        - SUPPLIES\n        - Company -[SUPPLIES]-> Reagent (or Equipment)\n        - PARTNERS_WITH\n        - Company -[PARTNERS_WITH]-> Research Lab (or University / Company)\n        - WORKS_AT\n        - Scientist/PI/Business Leader -[WORKS_AT]-> Company/Research Lab/University\n        - PUBLISHES\n        - Research Lab/University -[PUBLISHES]-> Research Paper\n        - MENTIONS\n        - Research Paper -[MENTIONS]-> Gene or other biological / technical entity\n        - ANNOUNCED_LAUNCH_EVENT\n        - Company -[ANNOUNCED_LAUNCH_EVENT]-> New Product Launch\n        - DESCRIBES\n        - Company -[DESCRIBES]-> Process (e.g., Fermentation Process)\n        - Patent -[DESCRIBES]-> Process (e.g., Purification Method)\n        - IMPACTS\n        - Process -[IMPACTS]-> Product Quality\n        - Fermentation Process -[IMPACTS]-> Product Yield\n        - INCLUDES\n        - Company -[INCLUDES]-> Research Paper\n        - Company -[INCLUDES]-> Patent\n\n        If the text implies other meaningful relations but they do not fit the above, you may use a generic type:\n        - RELATED_TO\n\n        --------------------\n        # OUTPUT JSON SCHEMA\n\n        You MUST return a JSON object with the following fields:\n\n        {\n        \"entities\": [\n            {\n            \"name\": \"string, canonical name of the entity\",\n            \"type\": \"one of the entity types listed above\",\n            \"aliases\": [\"optional alias1\", \"optional alias2\"],\n            \"description\": \"short description based on the text (1-2 sentences)\",\n            \"extra\": {\n                \"country\": \"optional, for Company/University\",\n                \"stage\": \"optional, for Funding Round or Clinical Trial phase\",\n                \"role\": \"optional, for Scientist/PI/Business Leader\",\n                \"date\": \"optional, for events (YYYY-MM-DD if available)\"\n            }\n            }\n        ],\n        \"relations\": [\n            {\n            \"source\": \"entity name\",\n            \"target\": \"entity name\",\n            \"type\": \"one of the relation types listed above or 'RELATED_TO'\"\n            }\n        ]\n        }\n\n        --------------------\n        # INPUT TEXT\n\n        Please extract knowledge from the following Markdown:\n\n        {{markdown}}\n\n        # INPUT OLDJSON\n\n        Please Merge the results into the old JSON.:\n\n        {{oldjson}}\n        --------------------\n        # STRATEGY TO AVOID MISSING ENTITIES AND RELATIONS\n\n        1. **Entity and Relation Classification Expansion**:\n        - The entity and relation types listed above should be considered as an evolving, open-ended classification system. If new entities or relations emerge, they should be added to the result json to reflect the growing nature of the domain.\n        - **For example**: Entities such as **Process Entities** (e.g., Fermentation Process, Purification Method) and **Research Elements** (e.g., Clinical Trials, Research Topics) should be recognized and captured when found in the text.\n\n        3. **Use of Generic Relations**:\n        - If an entity or relation is difficult to classify or does not clearly fit into the predefined categories, use the generic relation type **RELATED_TO** to ensure no meaningful information is omitted.\n\n        \"\"\""

